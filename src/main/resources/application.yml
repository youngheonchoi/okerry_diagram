spring:
  application:
    name: okerry-diagram
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

spring-flow:
  git:
    clone-timeout-seconds: ${GIT_CLONE_TIMEOUT_SECONDS:60}
  workspace:
    root: ${WORKSPACE_ROOT:${java.io.tmpdir}/spring-flow/workspaces}
