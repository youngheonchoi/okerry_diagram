<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Flow</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <section class="intro">
        <p class="eyebrow">SPRING FLOW</p>
        <h1>Spring 메서드 호출 흐름을 분석합니다.</h1>
        <p class="description">
            Git Repository URL을 입력하면 Controller부터 Mapper까지의 호출 관계를 시각화합니다.
        </p>
    </section>

    <section class="analysis-card" aria-labelledby="repository-label">
        <label id="repository-label" for="repository-url">Git Repository URL</label>
        <form class="repository-form">
            <input id="repository-url" type="url" placeholder="https://github.com/example/sample.git" required>
            <button id="analyze-button" type="submit">Analyze</button>
        </form>
        <p id="form-help" class="form-help">Public Git Repository URL만 지원합니다.</p>
    </section>

    <section id="controller-results" class="analysis-card controller-results" hidden aria-labelledby="controller-results-title">
        <h2 id="controller-results-title">Controller APIs</h2>
        <div id="controller-list"></div>
    </section>
</main>
<script th:src="@{/js/index.js}"></script>
</body>
</html>
