<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring Flow</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main class="page-shell">
    <section class="intro">
        <p class="eyebrow">SPRING FLOW</p>
        <h1>Spring 메서드 호출 흐름을 분석합니다.</h1>
        <p class="description">
            Git Repository URL을 입력하면 Controller부터 Mapper까지의 호출 관계를 시각화합니다.
        </p>
    </section>

    <section class="analysis-card" aria-labelledby="repository-label">
        <label id="repository-label" for="repository-url">Git Repository URL</label>
        <div class="repository-form">
            <input id="repository-url" type="url" placeholder="https://github.com/example/sample.git" disabled>
            <button type="button" disabled>Analyze</button>
        </div>
        <p class="form-help">Repository 분석 기능은 다음 개발 단계에서 사용할 수 있습니다.</p>
    </section>
</main>
</body>
</html>
